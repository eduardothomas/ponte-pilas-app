name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas-y-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore PontePilas.slnx
      - run: dotnet build PontePilas.slnx --no-restore -c Release
      - run: dotnet test PontePilas.slnx --no-build -c Release --logger "console;verbosity=normal"
