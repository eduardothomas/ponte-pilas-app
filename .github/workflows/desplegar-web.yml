name: Desplegar web (Azure Static Web Apps)

# Publica producción solo después de un merge autorizado a main.
# Requiere el secreto AZURE_STATIC_WEB_APPS_API_TOKEN y la variable API_URL (Settings → Secrets and variables → Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: produccion
    env:
      TOKEN_SWA: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Verificar configuración
        if: env.TOKEN_SWA == ''
        run: echo "::notice::Falta el secreto AZURE_STATIC_WEB_APPS_API_TOKEN; no se despliega."
      - uses: actions/checkout@v5
        if: env.TOKEN_SWA != ''
      - uses: actions/setup-dotnet@v5
        if: env.TOKEN_SWA != ''
        with:
          global-json-file: global.json
      - name: Configurar URL de la API
        if: env.TOKEN_SWA != ''
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          printf '{ "ApiUrl": "%s" }\n' "$API_URL" > src/PontePilas.Web/wwwroot/appsettings.Production.json
      - name: Publicar
        if: env.TOKEN_SWA != ''
        run: dotnet publish src/PontePilas.Web -c Release -o publicado
      - uses: Azure/static-web-apps-deploy@v1
        if: env.TOKEN_SWA != ''
        with:
          azure_static_web_apps_api_token: ${{ env.TOKEN_SWA }}
          action: upload
          app_location: publicado/wwwroot
          skip_app_build: true
          skip_api_build: true
